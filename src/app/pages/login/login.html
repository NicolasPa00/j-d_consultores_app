<div class="acceso">
  <!-- Escena noche compartida con Recuperar y Restablecer (DESIGN §7 «Login»). -->
  <app-escena-acceso
    titulo="Órdenes de servicio SST, de la ARL al cobro."
    texto="Importe las órdenes de Bolívar, SURA, AXA Colpatria y Colmena, prográmelas con su equipo y cierre el ciclo con la factura."
  />

  <!-- Credenciales: la hoja blanca -->
  <main class="acceso__hoja">
    <div class="acceso__caja">
      <h1 class="acceso__titulo">Ingrese a ORBITA</h1>
      <p class="acceso__bajada">Use su documento de identidad y la contraseña que le asignó JD&amp;D&nbsp;Consultores.</p>

      <!-- Formulario con autenticación real (JWT) -->
      <form class="acceso__form" (ngSubmit)="submit()">
        <div class="form-field">
          <label class="form-field__label" for="acceso-documento">Documento de identidad</label>
          <span class="field-wrap">
            <span class="acceso__icono" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="5" width="18" height="14" rx="2" />
                <circle cx="9" cy="11" r="2" />
                <path d="M6 16c.6-1.4 1.7-2 3-2s2.4.6 3 2M15 10h3M15 13h3" />
              </svg>
            </span>
            <input
              id="acceso-documento"
              class="form-control form-control--con-icono"
              type="text"
              name="documento"
              inputmode="numeric"
              placeholder="Ej. 1234567890"
              autocomplete="username"
              [class.form-control--error]="intentoVacio() && !documento.trim()"
              [attr.aria-invalid]="intentoVacio() && !documento.trim() ? 'true' : null"
              [(ngModel)]="documento"
            />
          </span>
        </div>

        <!-- «¿Olvidó su contraseña?» va en el DOM DESPUÉS del campo (y del ojo),
             como antes del rediseño: Tab desde Documento salta directo a la
             contraseña. Solo se pinta en la línea de la etiqueta. -->
        <div class="form-field acceso__campo-clave">
          <label class="form-field__label" for="acceso-clave">Contraseña</label>
          <span class="field-wrap">
            <span class="acceso__icono" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4.5" y="10.5" width="15" height="10" rx="2" />
                <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" />
              </svg>
            </span>
            <input
              id="acceso-clave"
              class="form-control form-control--con-icono form-control--with-action"
              [type]="showPassword() ? 'text' : 'password'"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              [class.form-control--error]="intentoVacio() && !password"
              [attr.aria-invalid]="intentoVacio() && !password ? 'true' : null"
              [(ngModel)]="password"
            />
            <button
              type="button"
              class="field-toggle"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              [title]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              @if (showPassword()) {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M10.6 6.2A9.9 9.9 0 0 1 12 6c6.5 0 10 6 10 6a17.6 17.6 0 0 1-3.2 3.9" />
                  <path d="M6.6 6.7A17.4 17.4 0 0 0 2 12s3.5 6 10 6a9.9 9.9 0 0 0 4.3-.9" />
                  <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                  <path d="m2 2 20 20" />
                </svg>
              } @else {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              }
            </button>
          </span>
          <a class="acceso__enlace acceso__olvido" routerLink="/recuperar">¿Olvidó su contraseña?</a>
        </div>

        @if (error(); as msg) {
          <div class="alert alert--error" role="alert">
            <span class="alert__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 8v5M12 16h.01" />
              </svg>
            </span>
            <div class="alert__body">
              <p class="alert__title">{{ msg }}</p>
            </div>
          </div>
        }

        <button class="btn btn--primary btn--block btn--lg" type="submit" [disabled]="loading()">
          {{ loading() ? 'Ingresando…' : 'Ingresar' }}
        </button>
      </form>

      <p class="acceso__legal">¿No tiene usuario? Pídalo a la administración de JD&amp;D&nbsp;Consultores.</p>
    </div>

    <p class="acceso__pie">© 2026 JD&amp;D Consultores · Gestión de Órdenes de Servicio</p>
  </main>
</div>
