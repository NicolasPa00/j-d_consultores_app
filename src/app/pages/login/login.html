<div class="login">
  <!-- ===== Izquierda: panel de marca ===== -->
  <aside class="login__brand">
    <div class="login__brand-inner">
      <div class="brand-logo">
        <img
          src="logoJDD-Consultores.png"
          alt="JD&D Consultores - Sistemas de Gestión"
        />
      </div>
      <p class="brand-text">Consultores en Sistemas de Gestión</p>
    </div>
  </aside>

  <!-- ===== Derecha: formulario ===== -->
  <main class="login__form-side">
    <div class="login-card">
      <header class="login-card__head">
        <h2 class="login-card__title">Bienvenido de nuevo</h2>
        <p class="login-card__subtitle">Ingrese sus credenciales para continuar</p>
      </header>

      <!-- Formulario con autenticación real (JWT) -->
      <form class="login-form" (ngSubmit)="submit()">
        <label class="field">
          <span class="field__label">Documento de identidad</span>
          <input
            class="field__input"
            type="text"
            name="documento"
            inputmode="numeric"
            placeholder="Ej. 1234567890"
            autocomplete="username"
            [(ngModel)]="documento"
          />
        </label>

        <label class="field">
          <span class="field__label">Contraseña</span>
          <span class="field__wrap">
            <input
              class="field__input field__input--with-action"
              [type]="showPassword() ? 'text' : 'password'"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              [(ngModel)]="password"
            />
            <button
              type="button"
              class="field__toggle"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              [title]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              @if (showPassword()) {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M10.6 6.2A9.9 9.9 0 0 1 12 6c6.5 0 10 6 10 6a17.6 17.6 0 0 1-3.2 3.9" />
                  <path d="M6.6 6.7A17.4 17.4 0 0 0 2 12s3.5 6 10 6a9.9 9.9 0 0 0 4.3-.9" />
                  <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                  <path d="m2 2 20 20" />
                </svg>
              } @else {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              }
            </button>
          </span>
        </label>

        @if (error(); as msg) {
          <div class="alert alert--error" role="alert">
            <span class="alert__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 8v5M12 16h.01" />
              </svg>
            </span>
            <div class="alert__body">
              <p class="alert__title">{{ msg }}</p>
            </div>
          </div>
        }

        <a class="login-card__forgot" routerLink="/recuperar">¿Olvidó su contraseña?</a>

        <button class="btn-primary" type="submit" [disabled]="loading()">
          {{ loading() ? 'Ingresando…' : 'Ingresar' }}
        </button>
      </form>

      <p class="login-card__footer">
        © 2026 JD&amp;D Consultores · Gestión de Órdenes de Servicio
      </p>
    </div>
  </main>
</div>
