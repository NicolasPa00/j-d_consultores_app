<!-- 20-nov-2026 · Estadísticas: cabecera + conmutación por sistema, y nada más.
     Cada sistema pinta su propia pantalla; este @switch es el ÚNICO punto donde
     se decide cuál (veredicto `op-veredicto.md` §3.0). -->
<!-- El nombre del sistema ya lo dice el segmentado de la barra superior: aquí
     queda solo para lectores de pantalla y la cabecera gana una línea (ronda 2:
     a 1366 × 768 el lienzo de Operación tiene que verse entero). -->
<section class="page-head page-head--compacta">
  <h2 class="page-head__title">Estadísticas <span class="visualmente-oculto">· {{ sistema.activo().nombre }}</span></h2>
</section>

@switch (sistema.activo().id) {
  @case ('finanzas') {
    <app-estadisticas-finanzas />
  }
  @default {
    <app-estadisticas-operacion />
  }
}
