<main class="brand-screen sistemas">
  <header class="sistemas__cabecera">
    <img class="sistemas__logo" src="logo-orbita-horizontal-claro.webp" alt="ORBITA · Gestión Inteligente" />
    <button type="button" class="btn btn--outline-light sistemas__salir" (click)="logout()">Cerrar sesión</button>
  </header>

  <section class="sistemas__cuerpo">
    <p class="sistemas__saludo">Hola{{ usuario()?.nombre ? ', ' + usuario()!.nombre : '' }}</p>
    <h1 class="sistemas__titulo">¿En qué sistema va a trabajar?</h1>
    <p class="sistemas__sub">Puede cambiar de sistema cuando quiera desde la barra superior, sin cerrar sesión.</p>

    <div class="sistemas__tarjetas">
      @for (s of opciones(); track s.id) {
        <button type="button" class="card card--interactive tarjeta" [class.tarjeta--finanzas]="s.id === 'finanzas'" (click)="elegir(s.id)">
          <span class="tarjeta__icono" aria-hidden="true">
            @if (s.id === 'operacion') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="3" width="16" height="18" rx="2" />
                <path d="M8 8h8M8 12h8M8 16h5" />
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" />
              </svg>
            }
          </span>
          <span class="tarjeta__nombre">{{ s.nombre }}</span>
          <span class="tarjeta__descripcion">{{ s.descripcion }}</span>
          <span class="chip-list tarjeta__pantallas">
            @for (p of s.pantallas; track p) {
              <span class="chip">{{ p }}</span>
            }
          </span>
          <span class="link-cta tarjeta__entrar">Entrar a {{ s.nombre }} <span aria-hidden="true">→</span></span>
        </button>
      }
    </div>

    <label class="sistemas__recordar">
      <input type="checkbox" [ngModel]="recordar()" (ngModelChange)="recordar.set($event)" />
      Recordar mi elección en este equipo
    </label>
  </section>
</main>
